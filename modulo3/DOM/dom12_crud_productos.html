<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización del DOM</title>
    <script src="dom12_crud_productos.js" defer></script>
    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h2{
            color: #333;
        }
        table{
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td{
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th{
            background-color: #f2f2f2;
        }
        tr:nth-child(even){
            background-color: #f9f9f9;
        }
        .formulario{
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
        }
        .formulario input{
            margin: 5px;
            padding: 8px;
            width: 200px;
        }
        .formulario input{
            width: 100px;
            padding: 5px;
            margin-bottom: 8px;

        }
        .btn-agregar:hover{
            background-color: #4CAF50;
            color: white;
        }
        .btn-cancelar:hover{
            background-color: #f44336;
            color: white;
        }
    </style>
</head>
<body> 
    <h1 id="titulo">Eventos del DOM</h1>
    <h2>Grud de productos Producto</h>
    <div>
        <h3>Agregar Producto</h3>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Nombre del producto">
        <label for="descripcion">Descripción:</label>
        <input type="text" id="descripcion" placeholder="Descripción del producto">
        <label for="precio">Precio:</label>
        <input type="number" id="precio" placeholder="Precio del producto">
        <button id="btnAgregar" class="btn-agregar">Agregar Producto</button>
        <button id="btncancelar" class="btn-cancelar">Cancelar</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="CuerpoTabla">    <!-- Aquí se agregarán los productos -->
        </tbody>
    </table>   
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formularios</title>
</head>
<body>
    <h1>formularios</h1>
    <form action="/procesar" method="post">
        <table>
            <tr>
                <td>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Correo Electronico
                        <input type="email" id="email" name="email">
                    </label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password">
                    <button type="submit">Enviar</button>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="url">Sitio Web</label>
                    <input type="url" id="url" name="url">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="telefono">Telefono</label>
                    <input type="tel" id="telefono" name="telefono">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="buscar">Buscar</label>
                    <input type="search" id="buscar" name="buscar">
                </td>
            </tr>
            <!--tipos numericos-->
            <tr>
                <td>
                    <label for="edad">Edad</label><br>
                    <input type="number" id="edad" name="edad" min="0" max="120" step="1">
                </td>
                <td>
                    <label for="Volumen">Volumen<span id="val-vol">50</span></label><br></label>
                    <input type="range" id="volumen" name="volumen" min="0" max="120" value="50"
                    oninput="document.getElementById('val-vol').textContent=this.value">
                    
                </td>
            </tr>
    </form>
    
</body>
</html>
